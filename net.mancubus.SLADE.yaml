app-id: net.mancubus.SLADE
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk

command: slade3.sh
finish-args:
  - --device=dri
  - --socket=x11
  - --share=ipc
  - --socket=pulseaudio

  # Base editor requirements
  - --filesystem=home

  # GZDoom requirements
  - --env=DOOMWADDIR=/app/share/games/doom

  # Simpler way of preventing KDE related errors in GZDoom
  - --env=KDE_FULL_SESSION=false

  # required for start page
  - --share=network

  # Migrate Dconf
  - --metadata=X-DConf=migrate-path=/net/mancubus/SLADE/

cleanup:
  - /app/include
  - /app/lib/*.a
  - /app/lib/*.la
  - /app/lib/pkgconfig

modules:

  - name: slade-eol
    buildsystem: simple
    build-commands:
      - install -Dm0755 slade3.sh /app/bin/slade3.sh
      - install -Dm 644 net.mancubus.SLADE.desktop -t /app/share/applications
      - install -Dm 644 net.mancubus.SLADE.png -t /app/share/icons/hicolor/128x128/apps/resources/
      - install -Dm 644 net.mancubus.SLADE.appdata.xml -t /app/share/metainfo
    sources:
      - type: file
        path: resources/slade3.sh
      - type: file
        path: resources/net.mancubus.SLADE.desktop
      - type: file
        path: resources/net.mancubus.SLADE.png
      - type: file
        path: resources/net.mancubus.SLADE.appdata.xml

